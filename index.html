<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ビジ法2級 精選フラッシュカード</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d4ed8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #f5f5f4;
    color: #1c1917;
  }
  h1 { font-size: 1.1rem; padding: 16px; margin: 0; }
  #chapter-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 16px 16px;
  }
  .chapter-item {
    text-align: left;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid #d6d3d1;
    background: white;
    font-size: 1rem;
    cursor: pointer;
  }
  .chapter-item:active { background: #e7e5e4; }
  .chapter-item-title { display: block; }
  .chapter-item-master { display: block; font-size: 0.75rem; color: #78716c; margin-top: 2px; }
  .chapter-toolbar {
    display: flex;
    gap: 8px;
    padding: 0 16px 12px;
  }
  .chapter-toolbar button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #d6d3d1;
    background: white;
    font-size: 0.9rem;
  }
  #btn-master-skip.active { background: #7c3aed; border-color: #7c3aed; color: white; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    padding: 12px 16px;
  }
  .toolbar button {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #d6d3d1;
    background: white;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  #progress-label { flex: 1; text-align: center; font-size: 0.85rem; }
  #slider { width: calc(100% - 32px); margin: 0 16px 8px; }
  #card {
    margin: 0 16px 16px;
    border: 1px solid #d6d3d1;
    border-radius: 12px;
    background: white;
    overflow: hidden;
  }
  .card-header {
    padding: 14px 20px 0;
  }
  .chapter-line { font-size: 0.95rem; font-weight: bold; color: #78716c; }
  .question-line { font-size: 0.95rem; font-weight: bold; margin-top: 2px; }
  .card-face {
    padding: 12px 20px 20px;
    min-height: 220px;
    cursor: pointer;
  }
  .card-back { display: none; }
  #card.flipped .card-front { display: none; }
  #card.flipped .card-back { display: block; }
  .exam-ref { font-size: 0.8rem; color: #78716c; margin-top: 16px; }
  .choice-note { font-size: 0.8rem; color: #78716c; margin-top: 10px; }
  .tap-hint { font-size: 0.8rem; color: #a8a29e; margin-top: 16px; }
  .answer-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #1c1917;
    background: #1c1917;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  .answer-btn:disabled {
    background: #e7e5e4;
    border-color: #d6d3d1;
    color: #a8a29e;
    cursor: not-allowed;
  }
  #question-text p, #answer-text p { line-height: 1.6; margin: 0 0 10px; }
  #question-text ul, #answer-text ul { margin: 0 0 10px; padding-left: 1.4em; }
  #answer-text li { margin-bottom: 1em; }
  #answer-text li:last-child { margin-bottom: 0; }
  #answer-result { font-weight: bold; font-size: 1.1rem; margin: 0 0 10px; }
  #answer-result.correct { color: #16a34a; }
  #answer-result.incorrect { color: #dc2626; }
  .master-btn {
    display: block;
    width: 100%;
    margin: 0 0 12px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #d6d3d1;
    background: white;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .master-btn.active { background: #7c3aed; border-color: #7c3aed; color: white; }
  .choice {
    padding: 12px 14px;
    border: 1px solid #d6d3d1;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 1rem;
    font-weight: normal;
    line-height: 1.5;
    white-space: pre-line;
    cursor: pointer;
  }
  .choice.selected { background: #1c1917; color: white; border-color: #1c1917; }
  #question-text u.choice-span { cursor: pointer; text-decoration-thickness: 2px; }
  #question-text u.choice-span.selected { background: #1c1917; color: white; }
  .star-row-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-top: 1px solid #e7e5e4;
  }
  .star-row { font-size: 1.05rem; letter-spacing: 2px; color: #d97706; }
  #btn-star-reset {
    font-size: 0.75rem;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #d6d3d1;
    background: white;
  }
  .overlay[hidden] { display: none; }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay-content {
    background: white;
    border-radius: 12px;
    padding: 20px;
    max-width: 400px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .overlay-content h2 { margin-top: 0; font-size: 1.1rem; }
  .overlay-content ul { padding-left: 1.2em; }
  .overlay-content button {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #d6d3d1;
    background: white;
  }
  .memo-container { margin-top: 16px; }
  .memo-list-card-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #d6d3d1;
    background: white;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .memo-label { display: block; font-size: 0.8rem; color: #78716c; margin-bottom: 4px; }
  .memo-input {
    width: 100%;
    min-height: 80px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #d6d3d1;
    font-size: 16px;
    font-family: inherit;
    resize: vertical;
    box-sizing: border-box;
  }
  .memo-item { margin-bottom: 12px; list-style: none; cursor: pointer; }
  .memo-item:last-child { margin-bottom: 0; }
  .memo-item-title { font-weight: bold; font-size: 0.85rem; margin-bottom: 4px; cursor: pointer; }
  .memo-item-text { font-size: 0.85rem; color: #44403c; white-space: pre-line; cursor: pointer; }
</style>
</head>
<body>
<div id="chapter-screen">
  <h1>ビジ法2級 精選フラッシュカード</h1>
  <div class="chapter-toolbar">
    <button id="btn-master-skip"></button>
    <button id="btn-memo-list">メモ一覧</button>
  </div>
  <div id="chapter-list"></div>
</div>
<div id="card-screen" hidden>
  <div class="toolbar">
    <button id="btn-back">← 章一覧</button>
    <button id="btn-prev">前へ</button>
    <span id="progress-label"></span>
    <button id="btn-next">次へ</button>
    <button id="btn-score">成績を見る</button>
  </div>
  <input type="range" id="slider" min="1" max="1" value="1">
  <div id="card">
    <div class="card-header">
      <div class="chapter-line" id="header-chapter"></div>
      <div class="question-line" id="header-question"></div>
    </div>
    <div class="card-face card-front">
      <div id="question-text"></div>
      <div id="choices-container"></div>
      <div class="choice-note" id="choice-note" hidden></div>
      <div class="exam-ref" id="exam-ref"></div>

    <div class="card-face card-back">
      <div id="answer-result"></div>

      <button id="btn-memo-list-card" class="memo-list-card-btn">メモ一覧</button>

      <button id="btn-star-reset">実施回数リセット</button>

</div>
<div class="overlay" id="score-overlay" hidden>
  <div class="overlay-content">
    <h2>成績</h2>
    <p id="score-summary"></p>
    <ul id="score-list"></ul>
    <button id="btn-score-reset">成績をリセット</button>
    <button id="btn-score-close">閉じる</button>
  </div>
</div>
<div class="overlay" id="memo-overlay" hidden>
  <div class="overlay-content">
    <h2>メモ一覧</h2>
    <ul id="memo-list"></ul>
    <button id="btn-memo-close">閉じる</button>
  </div>
</div>

<script src="cards.js"></script>
<script>
function masteryStats(cardsArray) {
  const total = cardsArray.length;
  const mastered = cardsArray.filter((c) => isMastered(c.id)).length;
  const pct = total === 0 ? 0 : Math.round((mastered / total) * 100);
  return { mastered, total, pct };
}

function renderChapterList() {
  const container = document.getElementById('chapter-list');
  container.innerHTML = '';

  const allStats = masteryStats(CARDS);
  const allBtn = document.createElement('button');
  allBtn.className = 'chapter-item';
  allBtn.innerHTML =
    `<span class="chapter-item-title">すべて［${CARDS.length}問］</span>` +
    `<span class="chapter-item-master">マスター ${allStats.mastered}/${allStats.total}（${allStats.pct}%）</span>`;
  allBtn.addEventListener('click', () => startChapter('all'));
  container.appendChild(allBtn);

  for (const ch of CHAPTERS) {
    const chapterCards = CARDS.filter((c) => c.chapter === ch.number);
    const stats = masteryStats(chapterCards);
    const btn = document.createElement('button');
    btn.className = 'chapter-item';
    btn.innerHTML =
      `<span class="chapter-item-title">第${ch.number}章 ${ch.title}［${ch.count}問］</span>` +
      `<span class="chapter-item-master">マスター ${stats.mastered}/${stats.total}（${stats.pct}%）</span>`;
    btn.addEventListener('click', () => startChapter(ch.number));
    container.appendChild(btn);
  }
}

const MASTER_SKIP_KEY = 'bizlaw2seisen:masterSkipEnabled';

function isMasterSkipEnabled() {
  try {
    return localStorage.getItem(MASTER_SKIP_KEY) === '1';
  } catch (e) {
    return false;
  }
}

function setMasterSkipEnabled(value) {
  try {
    if (value) {
      localStorage.setItem(MASTER_SKIP_KEY, '1');
    } else {
      localStorage.removeItem(MASTER_SKIP_KEY);
    }
  } catch (e) {
    // ignore
  }
}

function updateMasterSkipButton() {
  const enabled = isMasterSkipEnabled();
  const btn = document.getElementById('btn-master-skip');
  btn.textContent = enabled ? 'マスタースキップ: ON' : 'マスタースキップ: OFF';
  btn.classList.toggle('active', enabled);
}

document.getElementById('btn-master-skip').addEventListener('click', () => {
  setMasterSkipEnabled(!isMasterSkipEnabled());
  updateMasterSkipButton();
});

let currentCards = [];
let currentIndex = 0;
let isFlipped = false;
let selectedChoiceIndex = null;
let sessionResults = {};

const STAR_KEY_PREFIX = 'bizlaw2seisen:stars:';
const MAX_STARS = 10;
const JUDGMENT_RE = /(最も)?(適切|正しい|誤り)(（[〇✕○×]）)?(である|でない|くない)?/;

function getChapterMeta(chapterNumber) {
  return CHAPTERS.find((c) => c.number === chapterNumber);
}

function getStarCount(id) {
  try {
    const raw = parseInt(localStorage.getItem(STAR_KEY_PREFIX + id), 10);
    return Number.isFinite(raw) ? Math.min(MAX_STARS, Math.max(0, raw)) : 0;
  } catch (e) {
    return 0;
  }
}

function incrementStarCount(id) {
  const current = getStarCount(id);
  if (current >= MAX_STARS) return;
  try {
    localStorage.setItem(STAR_KEY_PREFIX + id, String(current + 1));
  } catch (e) {
    // ignore
  }
  renderStarRow(id);
}

function resetStarCount(id) {
  try {
    localStorage.removeItem(STAR_KEY_PREFIX + id);
  } catch (e) {
    // ignore
  }
  renderStarRow(id);
}

function renderStarRow(id) {
  const count = getStarCount(id);
  const row = document.getElementById('star-row');
  let stars = '';
  for (let i = 0; i < MAX_STARS; i++) {
    stars += i < count ? '★' : '☆';
  }
  row.textContent = stars;
}

const MASTER_KEY_PREFIX = 'bizlaw2seisen:master:';

function isMastered(id) {
  try {
    return localStorage.getItem(MASTER_KEY_PREFIX + id) === '1';
  } catch (e) {
    return false;
  }
}

function setMastered(id, value) {
  try {
    if (value) {
      localStorage.setItem(MASTER_KEY_PREFIX + id, '1');
    } else {
      localStorage.removeItem(MASTER_KEY_PREFIX + id);
    }
  } catch (e) {
    // ignore
  }
}

function updateMasterButton(id) {
  document.getElementById('btn-master').classList.toggle('active', isMastered(id));
}

const MEMO_KEY_PREFIX = 'bizlaw2seisen:memo:';

function getMemo(id) {
  try {
    return localStorage.getItem(MEMO_KEY_PREFIX + id) || '';
  } catch (e) {
    return '';
  }
}

function setMemo(id, text) {
  try {
    if (text.trim() === '') {
      localStorage.removeItem(MEMO_KEY_PREFIX + id);
    } else {
      localStorage.setItem(MEMO_KEY_PREFIX + id, text);
    }
  } catch (e) {
    // ignore
  }
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function formatText(text, renderBold) {
  if (renderBold === undefined) renderBold = true;
  const lines = text.split('\n');
  let html = '';
  let inList = false;
  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (line === '') {
      if (inList) { html += '</ul>'; inList = false; }
      continue;
    }
    const isBullet = /^[*\-]\s+/.test(line);
    const isContinuation = !isBullet && inList && /^\s/.test(rawLine);
    const content = isBullet ? line.replace(/^[*\-]\s+/, '') : line;
    // Bold markers in source material sometimes coincide with the correct answer
    // (e.g. real cards 12-15, 15-1 bold the very choice that answerIndex points to).
    // The question side must never render bold, or the front of the card leaks the
    // answer before it's flipped — so bold is only ever rendered on the answer side
    // (via formatExplanation, which calls this with renderBold left at its default).
    const withBold = renderBold
      ? escapeHtml(content).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      : escapeHtml(content).replace(/\*\*(.+?)\*\*/g, '$1');
    const withUnderline = withBold.replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>');
    if (isBullet) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${withUnderline}</li>`;
    } else if (isContinuation) {
      html = html.replace(/<\/li>$/, ` ${withUnderline}</li>`);
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<p>${withUnderline}</p>`;
    }
  }
  if (inList) html += '</ul>';
  return html;
}

function formatExplanation(text) {
  const lines = text.split('\n').map((line) => {
    const stripped = line.replace(/\*\*/g, '');
    const bulletMatch = stripped.match(/^([*\-]\s+)(.*)$/);
    const prefix = bulletMatch ? bulletMatch[1] : '';
    const rest = bulletMatch ? bulletMatch[2] : stripped;
    const jm = rest.match(JUDGMENT_RE);
    if (jm && jm[0] && jm.index <= 20) {
      const before = rest.slice(0, jm.index);
      const after = rest.slice(jm.index + jm[0].length);
      return `${prefix}${before}**${jm[0]}**${after}`;
    }
    return prefix + rest;
  });
  return formatText(lines.join('\n'));
}

function stripLeadingAnswerLine(text, answer) {
  const lines = text.split('\n');
  let i = 0;
  while (i < lines.length && lines[i].trim() === '') i++;
  if (i < lines.length) {
    const normalized = lines[i].trim().replace(/^\*+|\*+$/g, '').trim();
    const answerNormalized = normalized.replace(/^正解[:：]\s*/, '');
    if (normalized === answer || answerNormalized === answer) {
      lines.splice(0, i + 1);
    }
  }
  return lines.join('\n');
}

function showChapterScreen() {
  document.getElementById('card-screen').hidden = true;
  document.getElementById('chapter-screen').hidden = false;
  renderChapterList();
}

function showCardScreen() {
  document.getElementById('chapter-screen').hidden = true;
  document.getElementById('card-screen').hidden = false;
}

function startChapter(target) {
  let cards = target === 'all' ? CARDS : CARDS.filter((c) => c.chapter === target);
  if (isMasterSkipEnabled()) {
    cards = cards.filter((c) => !isMastered(c.id));
  }
  if (cards.length === 0) {
    alert(target === 'all' ? 'すべての問題がマスター済みです' : 'この章はすべてマスター済みです');
    return;
  }
  currentCards = cards;
  currentIndex = 0;
  isFlipped = false;
  sessionResults = {};
  showCardScreen();
  renderCard();
}

function renderHeader(card) {
  const meta = getChapterMeta(card.chapter);
  document.getElementById('header-chapter').textContent =
    `第${card.chapter}章 ${card.chapterTitle}（${meta ? meta.count : '?'}問）`;
  document.getElementById('header-question').textContent =
    `第${card.questionNumber}問　${card.title}`;
}

function renderChoices(card) {
  const container = document.getElementById('choices-container');
  container.innerHTML = '';

  if (card.isProse) {
    const spans = document.querySelectorAll('#question-text u');
    spans.forEach((span, idx) => {
      span.classList.add('choice-span');
      span.dataset.choiceIndex = String(idx);
      span.addEventListener('click', (e) => {
        e.stopPropagation();
        selectChoice(idx);
      });
    });
    updateChoiceSelectionUI();
    return;
  }

  card.choices.forEach((text, idx) => {
    const div = document.createElement('div');
    div.className = 'choice';
    div.textContent = text;
    div.dataset.choiceIndex = String(idx);
    div.addEventListener('click', (e) => {
      e.stopPropagation();
      selectChoice(idx);
    });
    container.appendChild(div);
  });
  updateChoiceSelectionUI();
}

function selectChoice(idx) {
  const card = currentCards[currentIndex];
  const isNewSelection = selectedChoiceIndex !== idx;
  selectedChoiceIndex = selectedChoiceIndex === idx ? null : idx;
  updateChoiceSelectionUI();
  if (isNewSelection && selectedChoiceIndex !== null) {
    incrementStarCount(card.id);
  }
  updateResultBadge();
  updateAnswerButtonState();
}

function updateResultBadge() {
  const card = currentCards[currentIndex];
  const el = document.getElementById('answer-result');
  if (selectedChoiceIndex === null || card.answerIndex === null || card.answerIndex === undefined) {
    el.textContent = '';
    el.className = '';
    return;
  }
  const isCorrect = selectedChoiceIndex === card.answerIndex;
  el.textContent = isCorrect ? '正解' : '不正解';
  el.className = isCorrect ? 'correct' : 'incorrect';
}

function updateChoiceSelectionUI() {
  document.querySelectorAll('.choice, #question-text u.choice-span').forEach((el) => {
    const idx = Number(el.dataset.choiceIndex);
    el.classList.toggle('selected', idx === selectedChoiceIndex);
  });
}

function recordAnswerIfNeeded(card) {
  if (card.answerIndex === null || card.answerIndex === undefined) return;
  if (selectedChoiceIndex === null) return;
  sessionResults[card.id] = selectedChoiceIndex === card.answerIndex ? 'correct' : 'incorrect';
}

function renderCard() {
  const card = currentCards[currentIndex];
  selectedChoiceIndex = null;

  window.scrollTo(0, 0);
  document.getElementById('progress-label').textContent = `${currentIndex + 1} / ${currentCards.length}`;
  const slider = document.getElementById('slider');
  slider.min = 1;
  slider.max = currentCards.length;
  slider.value = currentIndex + 1;

  renderHeader(card);
  document.getElementById('question-text').innerHTML = formatText(card.prompt, false);
  renderChoices(card);
  updateAnswerButtonState();
  const noteEl = document.getElementById('choice-note');
  noteEl.textContent = card.note || '';
  noteEl.hidden = !card.note;
  const examRefEl = document.getElementById('exam-ref');
  examRefEl.textContent = card.examRef;
  examRefEl.hidden = !card.examRef;
  document.getElementById('answer-text').innerHTML =
    `<p><strong>正解：${escapeHtml(card.answer)}</strong></p>` +
    formatExplanation(stripLeadingAnswerLine(card.explanation, card.answer));
  document.getElementById('card').classList.toggle('flipped', isFlipped);
  renderStarRow(card.id);
  updateMasterButton(card.id);
  document.getElementById('memo-input').value = getMemo(card.id);
  updateResultBadge();
}

function flipToggle() {
  const card = currentCards[currentIndex];
  isFlipped = !isFlipped;
  if (isFlipped) {
    recordAnswerIfNeeded(card);
    updateResultBadge();
  }
  document.getElementById('card').classList.toggle('flipped', isFlipped);
}

function flipToAnswer() {
  if (isFlipped) return;
  flipToggle();
}

function updateAnswerButtonState() {
  const hasSelectable = document.querySelectorAll('.choice, #question-text u.choice-span').length > 0;
  document.getElementById('btn-answer').disabled = hasSelectable && selectedChoiceIndex === null;
}

document.getElementById('card').addEventListener('click', () => {
  if (didSwipe) {
    didSwipe = false;
    return;
  }
  flipToggle();
});

const SWIPE_THRESHOLD = 50;
let touchStartX = null;
let touchStartY = null;
let didSwipe = false;

document.getElementById('card').addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.getElementById('card').addEventListener('touchmove', (e) => {
  if (touchStartX === null || e.touches.length !== 1) return;
  const deltaX = e.touches[0].clientX - touchStartX;
  const deltaY = e.touches[0].clientY - touchStartY;
  if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 10) {
    e.preventDefault();
  }
}, { passive: false });

document.getElementById('card').addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const touch = e.changedTouches[0];
  const deltaX = touch.clientX - touchStartX;
  const deltaY = touch.clientY - touchStartY;
  touchStartX = null;
  touchStartY = null;
  if (Math.abs(deltaX) >= SWIPE_THRESHOLD && Math.abs(deltaX) > Math.abs(deltaY)) {
    didSwipe = true;
    if (deltaX < 0) {
      goNext();
    } else {
      goPrev();
    }
  }
});

document.getElementById('btn-answer').addEventListener('click', (e) => {
  e.stopPropagation();
  flipToAnswer();
});

document.getElementById('btn-star-reset').addEventListener('click', (e) => {
  e.stopPropagation();
  resetStarCount(currentCards[currentIndex].id);
});

document.getElementById('btn-master').addEventListener('click', (e) => {
  e.stopPropagation();
  const id = currentCards[currentIndex].id;
  setMastered(id, !isMastered(id));
  updateMasterButton(id);
});

document.querySelector('.memo-container').addEventListener('click', (e) => {
  e.stopPropagation();
});
document.getElementById('memo-input').addEventListener('input', (e) => {
  setMemo(currentCards[currentIndex].id, e.target.value);
});

document.getElementById('btn-back').addEventListener('click', () => {
  showChapterScreen();
});

function goNext() {
  if (currentIndex < currentCards.length - 1) {
    currentIndex++;
    isFlipped = false;
    renderCard();
  }
}

function goPrev() {
  if (currentIndex > 0) {
    currentIndex--;
    isFlipped = false;
    renderCard();
  }
}

document.getElementById('btn-next').addEventListener('click', (e) => {
  e.stopPropagation();
  goNext();
});
document.getElementById('btn-prev').addEventListener('click', (e) => {
  e.stopPropagation();
  goPrev();
});
document.getElementById('slider').addEventListener('input', (e) => {
  currentIndex = Number(e.target.value) - 1;
  isFlipped = false;
  renderCard();
});

function showScoreOverlay() {
  const entries = Object.entries(sessionResults);
  const correct = entries.filter(([, v]) => v === 'correct').length;
  const total = entries.length;
  const rate = total === 0 ? null : Math.round((correct / total) * 100);
  document.getElementById('score-summary').textContent =
    total === 0 ? 'まだ回答していません' : `${total}問中${correct}問正解（正解率${rate}%）`;
  const list = currentCards
    .filter((c) => sessionResults[c.id])
    .map((c) => `<li>第${c.chapter}章 第${c.questionNumber}問（${escapeHtml(c.title)}）: ${sessionResults[c.id] === 'correct' ? '正解' : '不正解'}</li>`)
    .join('');
  document.getElementById('score-list').innerHTML = list;
  document.getElementById('score-overlay').hidden = false;
}

document.getElementById('btn-score').addEventListener('click', (e) => {
  e.stopPropagation();
  showScoreOverlay();
});
document.getElementById('btn-score-close').addEventListener('click', () => {
  document.getElementById('score-overlay').hidden = true;
});
document.getElementById('btn-score-reset').addEventListener('click', () => {
  sessionResults = {};
  showScoreOverlay();
});

function showMemoOverlay() {
  const withMemo = CARDS.filter((c) => getMemo(c.id).trim() !== '');
  const list = withMemo
    .map((c) => `<li class="memo-item" data-card-id="${c.id}"><div class="memo-item-title">第${c.chapter}章 第${c.questionNumber}問（${escapeHtml(c.title)}）</div><div class="memo-item-text">${escapeHtml(getMemo(c.id))}</div></li>`)
    .join('');
  document.getElementById('memo-list').innerHTML = list || '<li>メモはまだありません</li>';
  document.getElementById('memo-overlay').hidden = false;
}

document.getElementById('btn-memo-list').addEventListener('click', () => {
  showMemoOverlay();
});
document.getElementById('btn-memo-list-card').addEventListener('click', (e) => {
  e.stopPropagation();
  showMemoOverlay();
});
document.getElementById('btn-memo-close').addEventListener('click', () => {
  document.getElementById('memo-overlay').hidden = true;
});
document.getElementById('memo-list').addEventListener('click', (e) => {
  const item = e.target.closest('.memo-item');
  if (!item) return;
  const cardId = item.dataset.cardId;
  const card = CARDS.find((c) => c.id === cardId);
  if (!card) return;
  document.getElementById('memo-overlay').hidden = true;
  showCardScreen();
  currentCards = CARDS.filter((c) => c.chapter === card.chapter);
  currentIndex = currentCards.findIndex((c) => c.id === cardId);
  sessionResults = {};
  isFlipped = true;
  renderCard();
});

renderChapterList();
updateMasterSkipButton();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
